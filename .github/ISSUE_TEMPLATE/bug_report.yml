name: Bug report
description: Report something that isn't working correctly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the command you ran and its output (remove anything private).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx tubeship upload video.json --dry-run`
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tubeship version
      description: Output of `tubeship --version`
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: markdown
    attributes:
      value: "Never paste your client_secret.json, token.json or access tokens into an issue."
